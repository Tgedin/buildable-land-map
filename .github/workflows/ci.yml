name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test
      - name: Synthetic end-to-end run
        run: python -m blm sample

  check-plan-to-cost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plan-to-cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch: the default Linux wheel is the multi-GB GPU build)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: make lint
      - run: make test
