# Monthly refresh: Catastro + plan + LiDAR -> web/data, committed and redeployed.
# Run it by hand any time: Actions -> "Refresh data" -> Run workflow.
name: Refresh data

on:
  schedule:
    - cron: "17 5 1 * *"   # 05:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write   # commit web/data
  actions: write    # start the Pages deploy (a push by GITHUB_TOKEN does not trigger it)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Fetch Catastro, plan and LiDAR, then build
        run: python -m blm run
      - name: Screening of added homes (plan-to-cost)
        run: |
          pip install -e ./plan-to-cost
          python -m plan2cost.screen_map --parcels data/processed/*/parcels.parquet --out web/data/screening.json
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          git commit -m "data: monthly refresh $(date -u +%Y-%m)" || { echo "nothing to commit"; exit 0; }
          git push
          gh workflow run pages.yml
