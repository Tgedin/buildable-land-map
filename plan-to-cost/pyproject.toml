[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-to-cost"
version = "0.1.0"
description = "Phase 2 of the Housing AI roadmap: floor plan -> quantities -> priced estimate (BC3 price base)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["shapely>=2.0"]

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python-headless>=4.9", "scikit-image>=0.22"]
map = ["geopandas>=1.0", "pyarrow>=15"]
learn = ["torch>=2.2", "numpy>=1.26", "opencv-python-headless>=4.9"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.26", "opencv-python-headless>=4.9", "scikit-image>=0.22", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
