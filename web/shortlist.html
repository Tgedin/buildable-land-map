<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shortlist · Buildable Land Map</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="page.css" />
</head>
<body class="page">
  <script src="format.js"></script>
  <script>document.body.insertAdjacentHTML("afterbegin", topbar("table")); wireSearchToMap();</script>
  <div class="wrap">
  <h1>Ranked shortlist</h1>
  <p id="intro" class="muted">Loading…</p>
  <div class="warn" id="warn" hidden></div>
  <table id="list" hidden>
    <thead>
      <tr><th>Parcel</th><th>Type</th><th>Floors today (plan)</th><th>2-bed homes: up / ático</th>
          <th>Pessimistic</th><th>Base</th><th>Optimistic</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="muted" id="foot" hidden></p>
  <button id="more" type="button" hidden>Show more</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const cls = (v) => (v === null ? "" : v < 0 ? "neg" : "pos");

    Promise.all([
      fetch(DATA + "screening.json").then((r) => r.json()),
      fetch(DATA + "parcels.geojson").then((r) => r.json()),
      fetch(DATA + "summary.json").then((r) => r.json()),
    ]).then(([screening, parcels, summary]) => {
      const props = Object.fromEntries(parcels.features.map((f) => [f.properties.refcat, f.properties]));
      const rows = Object.entries(screening.parcels)
        .map(([ref, p]) => ({ ref, p, base: baseResidual(p) }))
        .filter((r) => r.base !== null)
        .sort((a, b) => (a.p.kind === "redevelopment") - (b.p.kind === "redevelopment") || b.base - a.base);

      const t = candidateTotals(screening); // the same numbers as the map's headline
      $("intro").textContent =
        `${fmt(t.parcels)} parcels in ${summary.label} can take two-bedroom homes on top: ${fmt(t.homes)} homes, ` +
        `by adding 1–2 floors up to the plan's height or a penthouse (ático). Together they could bear ` +
        `${kEur(t.eur.base)} for the air rights in the base case (${kEur(t.eur.pessimistic)} pessimistic, ` +
        `${kEur(t.eur.optimistic)} optimistic), before structural reinforcement. ` +
        `${fmt(t.redev)} more parcels would add 3+ floors: redevelopment, listed last and not counted.`;
      $("warn").hidden = false;
      $("warn").textContent =
        "A screening, not a design, a valuation or a permit. The prices, costs and profit behind the euro figures are " +
        "assumed (see each report). Structure, the existing stair, fire safety, owners' consent and permits are not checked.";

      const body = $("list").querySelector("tbody");
      const PAGE = 50;
      let shown = 0;
      const e = (r, k) => (r?.eur ? r.eur[k] : null);
      const both = (p, k) => {
        const parts = [e(p.residual_2bed, k), e(p.attic?.residual_2bed, k)].filter((x) => x != null);
        return parts.length ? parts.reduce((a, b) => a + b, 0) : null;
      };
      function more() {
        for (const { ref, p } of rows.slice(shown, shown + PAGE)) {
          const pr = props[ref] ?? {};
          const cell = (k) => `<td class="fig ${cls(both(p, k))}">${both(p, k) === null ? "–" : kEur(both(p, k))}</td>`;
          const tr = document.createElement("tr");
          tr.innerHTML =
            `<td class="fig"><a href="${withArea("report.html?ref=" + ref)}">${ref}</a></td>` +
            `<td>${p.kind === "redevelopment" ? '<span class="tag" title="Adds more floors than an existing structure usually carries (assumed cap: 2)">redevelopment</span>' : "rooftop"}</td>` +
            `<td class="fig">${fmt(pr.floors)} (${fmt(pr.plan_floors)})</td>` +
            `<td class="fig">${fmt(p.homes_2bed)} / ${fmt(p.attic?.homes_2bed ?? 0)}</td>` +
            cell("pessimistic") + cell("base") + cell("optimistic") +
            `<td><a href="${withArea("index.html")}#rc=${ref}">map</a></td>`;
          body.appendChild(tr);
        }
        shown = Math.min(shown + PAGE, rows.length);
        $("foot").textContent = `Showing ${shown} of ${rows.length}. Data generated ${screening.generated_at.slice(0, 10)}.`;
        $("more").hidden = shown >= rows.length;
      }
      $("more").addEventListener("click", more);
      more();
      $("list").hidden = false;
      $("foot").hidden = false;
    });
  </script>
</body>
</html>
