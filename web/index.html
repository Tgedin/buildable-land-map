<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buildable Land · rooftop screening</title>
  <meta name="description" content="Where could homes be added on top of existing buildings? Parcel by parcel, from Spanish open data: Catastro, PNOA LiDAR and the city plan." />
  <link rel="preload" href="vendor/geist/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Analytics (acceptance M3): privacy-friendly, no cookies. Create a free GoatCounter
       site, then uncomment and replace YOURCODE.
  <script data-goatcounter="https://YOURCODE.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  -->
</head>
<body class="app">
  <script src="format.js"></script>
  <script>document.body.insertAdjacentHTML("afterbegin", topbar("map"));</script>

  <div class="workspace">
    <aside id="rail" aria-label="Ranked candidates">
      <div class="rail-head">
        <div class="kpis" id="kpis"></div>
        <div class="filters" id="filters" role="group" aria-label="Show these kinds"></div>
      </div>
      <div class="list-head overline"><span>Parcel</span><span>Base case and range</span></div>
      <ol id="list" role="listbox" aria-label="Candidates, best first"></ol>
      <div class="rail-foot" id="rail-foot"></div>
    </aside>

    <div id="map-wrap">
      <div id="map" aria-label="Map of parcels"></div>
      <div id="view-switch" class="float" role="group" aria-label="Colour parcels by"></div>
      <div id="legend" class="float">
        <div class="overline" id="legend-title"></div>
        <div id="legend-ramp" class="ramp" hidden><span>0</span><span>1</span><span>2</span><span>3</span><span>4+</span></div>
        <ul id="legend-classes" class="chips"></ul>
        <label id="ortho-toggle"><input id="toggle-ortho" type="checkbox" /> Aerial photo (IGN PNOA)</label>
      </div>
      <div id="synthetic-banner" hidden>Synthetic sample data. Not a real place.</div>
    </div>

    <aside id="inspector" hidden aria-live="polite" aria-label="Parcel details"></aside>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
